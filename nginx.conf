server {
    listen 8080;
    server_name _;

    sendfile on;
    tcp_nopush on;
    etag on;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip: nivel 6 (buen equilibrio CPU/tamaño), `Vary` para que las cachés
    # intermedias no sirvan la versión comprimida a quien no la acepta, y sin
    # comprimir respuestas diminutas. Incluye wasm (runtime del personaje) y
    # fuentes; las imágenes ya van comprimidas (WebP/PNG) y no se tocan.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # Health real para Cloud Run startup/liveness (no SPA fallback).
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        # Requerido para el popup de Google Identity Services.
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # El documento de entrada (SPA) debe revalidarse siempre: si el navegador
        # reutiliza un index.html antiguo, carga bundles antiguos con hash y muestra
        # una versión anterior. Los assets con hash siguen en /assets/ (immutable).
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
