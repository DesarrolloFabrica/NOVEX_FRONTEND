<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><title>Panel composición</title>
<style>
  body{margin:0;font-family:Georgia,serif;background:#1a2438;color:#2a2118}
  .wrap{display:grid;grid-template-columns:1fr;gap:16px;padding:16px}
  .ticket{background:linear-gradient(180deg,#fff8e6,#f3e6c8);border-radius:14px;padding:14px;min-height:420px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .label{font:600 11px/1 system-ui;color:#6e5e4c;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
  .idle{text-align:center;padding:48px 12px}
  .idle h2{margin:0 0 8px;font-size:18px;font-weight:500}
  .idle p{margin:0 0 16px;font:12px/1.45 system-ui;color:#6e5e4c}
  .cta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .cta button{border:1px solid #2a2118;background:#fffaf0;border-radius:8px;padding:8px 12px;font:600 12px system-ui;cursor:default}
  .section{border:1px solid rgba(42,33,24,.2);border-radius:10px;background:rgba(255,250,240,.45);margin:0 0 6px;padding:9px 11px;font:600 12.5px system-ui}
  .section.expanded{padding-bottom:12px}
  .section .body{margin-top:8px;font:12px/1.45 system-ui;font-weight:400;color:#4a3d30}
  .actions{margin-top:16px;border:1px solid rgba(42,33,24,.18);border-radius:10px;background:rgba(255,248,230,.45);padding:12px 10px;position:relative;z-index:0}
  .actions h3{margin:0;font-size:13px;font-weight:500}
  .note{margin:8px 0 0;font:11px/1.4 system-ui;color:#6e5e4c}
  .title{margin:0 0 8px;font-size:18px;font-weight:500}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid rgba(42,33,24,.3);font:600 10px system-ui;margin-right:4px}
</style></head><body>
<div class="wrap">
  <div class="ticket" id="idle">
    <p class="label">Idle · Reportar o consultar</p>
    <div class="idle">
      <h2>Reportar o consultar</h2>
      <p>Elija un problema de la lista para ver su detalle, o registre un problema interno o una dependencia.</p>
      <div class="cta">
        <button>Problema interno</button>
        <button>Dependencia de otra coordinación</button>
      </div>
    </div>
  </div>
  </div></body></html>
