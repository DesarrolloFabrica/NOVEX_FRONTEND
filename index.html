<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/novex-mark.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Tono base del escenario ANTES de que llegue el CSS: sin esto el primer
      pintado era blanco y luego azul marino. Es el mismo tono que usan las
      pantallas de carga y la sala (platform-backgrounds.css).
    -->
    <style>
      html,
      body {
        background: #160d0b;
      }
    </style>
    <!--
      Precarga del escenario que se va a pintar primero, según el destino:
      con sesión guardada fuera del login, el escenario del circo del Centro;
      si no, el del login (marca, fondo y telones). Antes se precargaban
      siempre los del login, también al recargar el Centro.
    -->
    <script>
      ;(function () {
        var assets = [
          ['/novex-mark.webp', 'high'],
          ['/assets/login/login-stage-background.webp', 'high'],
          ['/assets/login/curtain-left.webp', 'auto'],
          ['/assets/login/curtain-right.webp', 'auto'],
        ]
        try {
          if (
            location.pathname.indexOf('/login') !== 0 &&
            localStorage.getItem('novex.auth.session.v1')
          ) {
            assets = [
              ['/assets/scenes/circus-stage-background.webp', 'high'],
              ['/assets/tickets/common/ticket-paper-cream.webp', 'auto'],
            ]
          }
        } catch (e) {}
        for (var i = 0; i < assets.length; i++) {
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.type = 'image/webp'
          link.href = assets[i][0]
          link.setAttribute('fetchpriority', assets[i][1])
          document.head.appendChild(link)
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Cinzel:wght@700;800&family=Merriweather:ital,wght@0,700;0,900;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#160d0b" />
    <meta
      name="description"
      content="NOVEX — Visión general"
    />
    <title>NOVEX | Visión general</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
