<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 268" fill="none" aria-hidden="true">
  <!--
    Capa decorativa de desgaste del margen (no es una foto de ticket completa).
    Solo marcas en la franja perimetral: fibras, motas ocres y abrasiones de
    esquina. El centro queda vac�o para no tapar contenido. En CSS se usa
    con mask de anillo (~1012 px) y tama�os en px fijos donde aplica.
  -->
  <!-- Esquinas m�s gastadas (ocre suave) -->
  <ellipse cx="18" cy="16" rx="28" ry="22" fill="#8a6a3a" opacity="0.22" />
